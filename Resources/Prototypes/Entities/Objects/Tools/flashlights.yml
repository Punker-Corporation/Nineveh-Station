- type: entity
  name: lanterna de instabilidade quântica
  parent: FlashlightLantern
  id: QuantumInstabilityFlashlight
  description: Um dispositivo de iluminação experimental. A luz parece viva e perturbada.
  components:
  - type: Sprite
    sprite: _Nineveh/Objects/Tools/quantum_flashlight.rsi
    layers:
    - state: flashlight_body
    - state: flashlight_light
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Item
    sprite: _Nineveh/Objects/Tools/quantum_flashlight.rsi
    storedRotation: -90
  - type: Clothing
    sprite: _Nineveh/Objects/Tools/quantum_flashlight.rsi
    quickEquip: false
    slots:
    - Belt
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 3.5
    energy: 0.8
    color: "#E0C090"
    castShadows: true
    netsync: false
  - type: HandheldLight
    addPrefix: false
    wattage: 1.2
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: chromatic_degradation
      property: Color
      maxDuration: 45.0
      startValue: "#E0C090"
      endValue: "#4A6A8A"
      isLooped: false
      interpolate: Linear
    - !type:FadeBehaviour
      id: intensity_wobble
      property: Energy
      maxDuration: 3.5
      startValue: 0.8
      endValue: 0.4
      isLooped: true
      reverseWhenFinished: true
      interpolate: Cubic
    - !type:PulseBehaviour
      id: catastrophic_blackout
      property: Energy
      interpolate: Nearest
      maxDuration: 2.0
      pulseDuration: 1.5
      startValue: 0.0
      endValue: 0.8
      isLooped: false
    - !type:PulseBehaviour
      id: contact_flicker
      property: Energy
      interpolate: Nearest
      maxDuration: 0.15
      pulseDuration: 0.05
      startValue: 0.0
      endValue: 0.8
      isLooped: true
    - !type:FadeBehaviour
      id: focus_breathing
      property: Radius
      maxDuration: 7.0
      startValue: 3.5
      endValue: 2.0
      isLooped: true
      reverseWhenFinished: true
      interpolate: Sine
  - type: ToggleableVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: inhand-left-light
        shader: unshaded
      right:
      - state: inhand-right-light
        shader: unshaded
  - type: ItemTogglePointLight
  - type: Appearance
  - type: StaticPrice
    price: 15
