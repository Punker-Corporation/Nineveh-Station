- type: entity
  name: lanterna tática de inspeção
  parent: BaseItem
  id: QuantumInstabilityFlashlight
  description: Um módulo óptico de campo com foco cônico, dissipação térmica e contatos sensíveis. A luz não promete conforto; ela apenas revela o que já estava perto.
  components:
  - type: Sprite
    sprite: Objects/Tools/flashlight.rsi
    layers:
    - state: flashlight
    - state: flashlight-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Item
    sprite: Objects/Tools/flashlight.rsi
    storedRotation: -90
  - type: Clothing
    sprite: Objects/Tools/flashlight.rsi
    quickEquip: false
    slots:
    - Belt
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: PointLight
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    radius: 7.5
    energy: 2.35
    softness: 0.55
    falloff: 8.4
    color: "#E0C090"
    castShadows: true
    netsync: false
  - type: HandheldLight
    addPrefix: false
    wattage: 1.2
  - type: FlashlightMaintenance
    focus: 0.84
    wideRadius: 4.5
    focusedRadius: 9.25
    wideEnergy: 1.25
    focusedEnergy: 2.95
    heatPerSecond: 5.3
    focusHeatMultiplier: 2.6
    batteryFocusCost: 0.95
    lensIntegrity: 0.94
    emitterIntegrity: 0.91
    contactIntegrity: 0.86
    heatSinkIntegrity: 0.88
  - type: LightBehaviour
    behaviours:
    - !type:ColorCycleBehaviour
      id: chromatic_degradation
      maxDuration: 45.0
      colors:
      - "#E0C090"
      - "#4A6A8A"
      isLooped: false
      interpolate: Linear
    - !type:FadeBehaviour
      id: intensity_wobble
      property: Energy
      maxDuration: 3.5
      startValue: 2.35
      endValue: 1.25
      isLooped: true
      reverseWhenFinished: true
      interpolate: Cubic
    - !type:PulseBehaviour
      id: catastrophic_blackout
      property: Energy
      interpolate: Nearest
      maxDuration: 2.0
      startValue: 0.0
      endValue: 2.35
      isLooped: false
    - !type:PulseBehaviour
      id: contact_flicker
      property: Energy
      interpolate: Nearest
      maxDuration: 0.15
      startValue: 0.0
      endValue: 2.35
      isLooped: true
    - !type:FadeBehaviour
      id: focus_breathing
      property: Radius
      maxDuration: 7.0
      startValue: 7.5
      endValue: 4.5
      isLooped: true
      reverseWhenFinished: true
      interpolate: Cubic
  - type: ToggleableVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: inhand-left-light
        shader: unshaded
      right:
      - state: inhand-right-light
        shader: unshaded
  - type: ItemTogglePointLight
  - type: ActivatableUI
    key: enum.FlashlightMaintenanceUiKey.Key
  - type: UserInterface
    interfaces:
      enum.FlashlightMaintenanceUiKey.Key:
        type: FlashlightMaintenanceBoundUserInterface
  - type: Appearance
  - type: StaticPrice
    price: 15
