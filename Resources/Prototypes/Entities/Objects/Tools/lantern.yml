- type: entity
  name: lantern
  parent: BaseItem
  id: Lantern
  description: The holy light guides the way.
  components:
    - type: HandheldLight
      addPrefix: true
      wattage: 1.05
      blinkingBehaviourId: blinking
      radiatingBehaviourId: radiating
    - type: FlashlightMaintenance
      focus: 0.62
      wideRadius: 4.25
      focusedRadius: 7.5
      wideEnergy: 1.35
      focusedEnergy: 2.45
      heatPerSecond: 1.45
      focusHeatMultiplier: 1.05
      coolingPerSecond: 7.0
      batteryFocusCost: 0.72
      lensIntegrity: 0.97
      emitterIntegrity: 0.95
      contactIntegrity: 0.93
      heatSinkIntegrity: 0.96
    - type: LightBehaviour
      behaviours:
      - !type:FadeBehaviour
        id: radiating
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
    - type: Sprite
      sprite: Objects/Tools/lantern.rsi
      layers:
      - state: lantern
      - state: lantern-on
        shader: unshaded
        visible: false
        map: [ "light" ]
    - type: Item
      sprite: Objects/Tools/lantern.rsi
      heldPrefix: off
    - type: UseDelay
      delay: 1
    - type: PointLight
      enabled: false
      mask: /Textures/Effects/LightMasks/cone.png
      autoRot: true
      radius: 6.25
      energy: 2.2
      softness: 0.7
      falloff: 6.9
      color: "#FFC458"
      castShadows: true
      netsync: false
    - type: Appearance
    - type: ToggleableVisuals
      spriteLayer: light
    - type: ItemTogglePointLight
    - type: ActivatableUI
      key: enum.FlashlightMaintenanceUiKey.Key
    - type: UserInterface
      interfaces:
        enum.FlashlightMaintenanceUiKey.Key:
          type: FlashlightMaintenanceBoundUserInterface
    - type: PowerCellSlot
      cellSlotId: cell_slot
    - type: ItemSlots
      slots:
        cell_slot:
          name: power-cell-slot-component-slot-name-default
          startingItem: PowerCellMedium
    - type: ContainerContainer
      containers:
        cell_slot: !type:ContainerSlot {}
    - type: StealTarget
      stealGroup: LAMP
    - type: Clothing
      sprite: Objects/Tools/lantern.rsi
      equippedPrefix: off
      quickEquip: false
      slots:
      - Belt
    - type: Tag
      tags:
      - Flashlight

- type: entity
  parent: Lantern
  id: LanternFlash
  suffix: Flash
  components:
    - type: Sprite
      sprite: Objects/Tools/lantern.rsi
      layers:
      - state: lantern
        map: [ "enum.FlashVisualLayers.BaseLayer" ]
      - state: lantern-on
        shader: unshaded
        visible: false
        map: [ "light" ]
      - state: flashing
        map: [ "enum.FlashVisualLayers.LightLayer" ]
        visible: false
    - type: PointLight
      radius: 5
      energy: 10
    - type: Flash
      flashOnMelee: false
      flashOnUse: false
    - type: LimitedCharges
      maxCharges: 15
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 0 # melee weapon to allow flashing individual targets
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.FlashVisuals.Burnt:
          enum.FlashVisualLayers.BaseLayer:
            True: {state: burnt}
        enum.FlashVisuals.Flashing:
          enum.FlashVisualLayers.LightLayer:
            True: {visible: true}
            False: {visible: false}
