- type: entity
  parent: BaseItem
  id: HandheldRadio
  name: "rádio portátil"
  description: "Um rádio de mão enferrujado. A estática nunca cessa. Possui 36 canais."
  components:
  - type: TelecomExempt
  - type: Sprite
    sprite: _Scp/Objects/Devices/radio.rsi
    layers:
    - state: common
  - type: Item
    sprite: _Scp/Objects/Devices/radio.rsi
    size: Small
  - type: RadioMicrophone
    broadcastChannel: Channel1
    enabled: true
    toggleOnInteract: false
  - type: RadioSpeaker
    channels:
    - Channel1
    enabled: true
    toggleOnInteract: false
  - type: HandheldRadio
    selectedChannel: 1
    minChannel: 1
    maxChannel: 36
    congestionUpdateSeconds: 110
  - type: ActivatableUI
    key: enum.HandheldRadioUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HandheldRadioUiKey.Key:
        type: HandheldRadioBoundUserInterface
  - type: EncryptionKeyHolder
    defaultChannel: Channel1
    keySlots: 1
  - type: CorruptedRadio
    corruptionChance: 0.7
    spoofChance: 0.25
    deadAirChance: 0.18
    whisperChance: 0.08
    silenceChance: 0.05
    infrasoundChance: 0.03
    semanticSatiationThreshold: 2
    jamaisVuChance: 0.10
    corruptionIntensity: 0.35
    corruptionReplacements: "!@#$%&*_?."
    whisperMessages:
    - "...v...ocê..."
    - "...me...ou...ve..."
    - "...atrás..."
    - "...não..."
    - "...s...o...z...i...n...h...o..."
    - "...cuidado..."
    - "...f...r...i...o..."
    - "...peso..."
    - "...v...a...z...i...o..."
    - "...eles..."
    - "...es...tá...tica..."
    - "...por quê?..."
    - "...silên...cio..."
    - "...olhos..."
    - "...mentira..."
    - "...voz..."
    - "...nunca..."
    - "...morte..."
    - "...a...ju...da..."
    - "...sem...pre..."
    spoofNames:
    - "???"
    - "Desconhecido"
    - "Sinal Fraco"
    - "Estática"
    - "Ninguém"
    - "000-0000"
    - "Vazio"
    - "..."
    - "Erro"
    - "Desconexão"
  - type: StaticPrice
    price: 25
